name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collect the page files
        run: |
          mkdir -p site
          cp index.html style.css app.js lab.css robots.txt favicon-*.png site/ && cp -r assets site/
      - name: publish main to the lab site
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
      - name: publish this PR to its own preview folder
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: pr/${{ github.event.number }}
          keep_files: true
      - name: post the preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://kdavis5111.github.io/htn-ui-lab/pr/${context.issue.number}/`;
            const body = `Preview for this PR: ${url}\n\nIt updates a minute or two after every push. Compare with main: https://kdavis5111.github.io/htn-ui-lab/`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('Preview for this PR'));
            if (mine) { await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body}); }
            else { await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body}); }
